name: Release

# Publishes to npm when a GitHub Release is published. The release tag must be "v" + the version in package.json.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or later.
      - run: npm install -g npm@11
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME doesn't match package.json version v$version"
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs the typecheck, build and tests before anything is uploaded.
      - run: npm publish --provenance --access public
        env:
          # Only needed if trusted publishing isn't set up (see RELEASING.md).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
